name: Daily Auto Commit

on:
  schedule:
    - cron: '15 23 * * *'  # 5:00 AM Nepal time
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: gyr0byte/daily-tracker
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update README and commit
        run: |
          git config user.name "gyr0byte"
          git config user.email "gqurav69@gmail.com"
          echo "# Daily Tracker" > README.md
          echo "" >> README.md
          echo "Last updated: $(date +'%B %d, %Y at %I:%M %p')" >> README.md
          echo "" >> README.md
          echo "Total days tracked: $(git rev-list --count HEAD 2>/dev/null || echo 1)" >> README.md
          git add README.md
          git commit --author="gyr0byte <gqurav69@gmail.com>" -m "chore: daily update $(date +'%Y-%m-%d')"
          git push
