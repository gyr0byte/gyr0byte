name: Daily Auto Commit

on:
  schedule:
    - cron: '15 12 * * *'  # 6:00 PM Nepal time
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Commit via GitHub API
        run: |
          DATE=$(date +'%Y-%m-%d')
          DATETIME=$(date +'%B %d, %Y at %I:%M %p')
          
          CONTENT=$(cat << EOF
          # Daily Tracker
          # Last updated: $DATETIME
          
          import datetime
          
          def get_info():
              last_updated = "$DATE"
              return last_updated
          
          if __name__ == "__main__":
              date = get_info()
              print(f"Last updated: {date}")
          EOF
          )
          
          ENCODED=$(echo "$CONTENT" | base64 -w 0)
          
          SHA=$(curl -s -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/gyr0byte/daily-tracker/contents/daily.py \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/gyr0byte/daily-tracker/contents/daily.py \
            -d "{\"message\": \"chore: daily update $DATE\", \"content\": \"$ENCODED\", \"sha\": \"$SHA\"}"
