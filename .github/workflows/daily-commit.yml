name: Daily Auto Commit

on:
  schedule:
    - cron: '15 23 * * *'  # 5:00 AM Nepal time
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: gyr0byte/daily-tracker
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update daily.py and commit
        run: |
          git config user.name "gyr0byte"
          git config user.email "gqurav69@gmail.com"
          cat > daily.py << EOF
          # Daily Tracker
          # Last updated: $(date +'%B %d, %Y at %I:%M %p')

          import datetime

          def get_info():
              last_updated = "$(date +'%Y-%m-%d')"
              day_count = $(git rev-list --count HEAD 2>/dev/null || echo 1)
              return last_updated, day_count

          if __name__ == "__main__":
              date, days = get_info()
              print(f"Last updated: {date}")
              print(f"Days tracked: {days}")
          EOF
          git add daily.py
          git commit --author="gyr0byte <gqurav69@gmail.com>" -m "chore: daily update $(date +'%Y-%m-%d')"
          git push
