name: Daily Auto Commit

on:
  schedule:
    - cron: '15 23 * * *'  # 5:00 AM Nepal time
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make 10 daily commits
        run: |
          git config user.name "gyr0byte"
          git config user.email "gqurav69@gmail.com"
          for i in {1..10}; do
            echo "Auto-updated: $(date) | commit $i" > last_updated.txt
            git add last_updated.txt
            git commit --author="gyr0byte <gqurav69@gmail.com>" -m "chore: daily update $(date +'%Y-%m-%d') [$i/10]"
          done
          git push
